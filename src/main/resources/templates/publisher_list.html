<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Publisher List</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" >
  <link th:href="@{/styles/tablesStyle.css}" rel="stylesheet" />
  <style>
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; min-height: 100vh; }
    main { flex: 1; display: flex; justify-content: center; align-items: start; padding-top: 50px; }
  </style>
</head>
<body>
  <div th:replace="~{common/header :: header}"></div>

  <main>
    <div class="table-panel">
      <h2>Publisher List</h2>

      <div class="table-responsive">
        <table class="has-actions">
          <thead>
            <tr>
              <th>Publisher Id</th>
              <th>Name</th>
              <th>Address</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="publisher : ${all}">
              <td th:text="${publisher.idp}">Publisher ID</td>
              <td th:text="${publisher.name}">Name</td>
              <td th:text="${publisher.address}">Address</td>
              <td>
                <a th:href="@{'/edit_publisher/' + ${publisher.idp}}">
                  <button type="button" class="btn btn-primary">Edit</button>
                </a>
                <a th:href="@{'/delete_publisher/' + ${publisher.idp}}">
                  <button type="button" class="btn btn-danger">Delete</button>
                </a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <div th:replace="~{common/footer :: footer}"></div>
</body>
</html>
