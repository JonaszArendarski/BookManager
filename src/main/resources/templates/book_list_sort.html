<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Sorted Book List By Title</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" >
<link th:href="@{/styles/tablesStyle.css}" rel="stylesheet" />
<style>
  html, body {
    height: 100%;
  }
  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  main {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: start; 
    padding-top: 50px;
  }
</style>
</head>
<body>
<div th:replace = "~{common/header :: header}"></div>
<div>
 <h2>Book List</h2>
 <br/><br/>
 <table>
 <thead>
 <tr>
 <th>Book Id</th>
 <th>Title</th>
 <th>Publisher</th>
 <th>Category</th>
 </tr>
 </thead>
 <tbody>
 <tr th:each="book : ${sortedBooks}">
 <td th:text="${book.idb}">Book ID</td>
 <td th:text="${book.title}">Title</td>
 <td th:text="${book.publisher.name}">Publisher</td>
 <td th:text="${book.category.description}">Category</td>
 <td>
 
 </td>
 </tr>
 </tbody>
 </table>
</div>
</body>

<div th:replace = "~{common/footer :: footer}"></div>
</html>
