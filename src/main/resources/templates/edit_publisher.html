<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Edit Publisher</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/styles/AddEditStyles.css}" rel="stylesheet" />
</head>
<body>
  <div th:replace="~{common/header :: header}"></div>

  <main>
    <div class="form-container">
      <h2 class="text-center mb-4">Edit Publisher</h2>
      <form action="#" th:action="@{/edit_publisher}" th:object="${pub}" method="post">
        <table>
          <tr>
            <td>Publisher ID:</td>
            <td><input type="text" th:field="*{idp}" readonly="readonly" class="form-control" /></td>
          </tr>
          <tr>
            <td>Name:</td>
            <td><input type="text" th:field="*{name}" class="form-control" /></td>
          </tr>
          <tr>
            <td>Address:</td>
            <td><input type="text" th:field="*{address}" class="form-control" /></td>
          </tr>
        </table>
        <div class="text-center mt-3">
          <button type="submit" class="btn btn-success px-4">Save</button>
        </div>
      </form>
    </div>
  </main>

  <div th:replace="~{common/footer :: footer}"></div>
</body>
</html>
