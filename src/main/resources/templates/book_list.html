<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Book List</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" >
<link th:href="@{/styles/tablesStyle.css}" rel="stylesheet" />
</head>
<body>
<div th:replace="~{common/header :: header}"></div>

<main>
  <div class="table-panel">
    <h2>Book List</h2>
    <table class="table table-striped table-bordered">
      <thead>
        <tr>
          <th>Book Id</th>
          <th>Title</th>
          <th>Publisher</th>
          <th>Category</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="book : ${lb}">
          <td th:text="${book.idb}">Book ID</td>
          <td th:text="${book.title}">Title</td>
          <td th:text="${book.publisher.name}">Publisher</td>
          <td th:text="${book.category.description}">Category</td>
          <td>
            <a th:href="@{'/edit_book/' + ${book.idb}}">
              <button type="button" class="btn btn-primary">Edit</button>
            </a>
            <a th:href="@{'/delete_book/' + ${book.idb}}">
              <button type="button" class="btn btn-danger">Delete</button>
            </a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</main>

<div th:replace="~{common/footer :: footer}"></div>
</body>
</html>
