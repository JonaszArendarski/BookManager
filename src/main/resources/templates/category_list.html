<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Categories List</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" >
  <link th:href="@{/styles/tablesStyle.css}" rel="stylesheet" />
  <style>
    /* drobna lokalna kopia layoutu (możesz usunąć jeśli globalny CSS już zawiera) */
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; min-height: 100vh; }
    main { flex: 1; display: flex; justify-content: center; align-items: start; padding-top: 50px; }
  </style>
</head>
<body>
  <div th:replace="~{common/header :: header}"></div>

  <main>
    <div class="table-panel">
      <h2>Categories List</h2>

      <div class="table-responsive">
        <table class="has-actions">
          <thead>
            <tr>
              <th>Category Id</th>
              <th>Description</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="category : ${allCategories}">
              <td th:text="${category.idc}">Category ID</td>
              <td th:text="${category.description}">Description</td>
              <td>
                <a th:href="@{'/edit_category/' + ${category.idc}}">
                  <button type="button" class="btn btn-primary">Edit</button>
                </a>
                <a th:href="@{'/delete_category/' + ${category.idc}}">
                  <button type="button" class="btn btn-danger">Delete</button>
                </a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <div th:replace="~{common/footer :: footer}"></div>
</body>
</html>
