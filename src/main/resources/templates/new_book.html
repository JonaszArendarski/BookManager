<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Edit Book</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" >
<link th:href="@{/styles/addstyle.css}" rel="stylesheet" />
<style>
  html, body {
    height: 100%;
  }
  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  main {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: start; 
    padding-top: 50px;
  }
</style>
</head>
<body>
<div th:replace = "~{common/header :: header}"></div>
<div>
 <h2>Create new book</h2>
 <br />
 <form action="#" th:action="@{/save_book}" th:object="${book}" method="post">
 <table>
 <tr>
 <td>Title:</td>
 <td><input type="text" th:field="*{title}" /></td>
 </tr>
 
 <tr>
 <td>Publisher: </td>
 <td>
<select th:field = "*{publisher.idp}">
<option th:each="pub : ${publishers}"
        th:value="${pub.idp}"
        th:text="${pub.name}">Publisher name</option>
</select> 
</td>
</tr>


 <tr>
 <td>Category :</td>
 <td>
<select th:field = "*{category.idc}">
<option th:each="cat : ${categories}"
        th:value="${cat.idc}"
        th:text="${cat.description}">Publisher name</option>
</select> 
</td>
 </tr>
 </table>
 <button type="submit" class="btn btn-success">Save</button>
 </form>
</div>
</body>

<div th:replace = "~{common/footer :: footer}"></div>
</html>
